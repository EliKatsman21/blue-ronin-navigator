<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>מיקום חי · Blue Ronin</title>
<meta name="theme-color" content="#0A111E">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/maplibre-gl/4.7.1/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&display=swap">
<style>
:root{--bg:#0A111E;--surface:#111B2D;--line:#24324A;--ink:#E6ECF4;--muted:#8C9DB3;--accent:#5C8DFF;--go:#2BB673;--warn:#D7263D;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 Assistant,system-ui,sans-serif}
#map{position:fixed;inset:0}
.card{position:fixed;z-index:2;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.card h1{margin:0;font-size:20px}.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#16223A;color:var(--ink);text-decoration:none;font:inherit;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.red{background:var(--warn);border-color:var(--warn);color:#fff}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--go);margin-inline-end:6px}.dot.old{background:#E0A43A}.dot.off{background:var(--muted)}
.sos{background:var(--warn);color:#fff;border-radius:12px;padding:10px 12px;font-weight:800;font-size:17px}
.brand{position:fixed;z-index:2;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));font:800 15px/1 Assistant,sans-serif;letter-spacing:1px;background:rgba(10,17,30,.8);padding:8px 12px;border-radius:999px;border:1px solid var(--line)}
.me{width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 6px rgba(92,141,255,.3)}
.me.sosm{background:var(--warn);box-shadow:0 0 0 8px rgba(215,38,61,.35)}
.bike{width:30px;height:30px;border-radius:8px;background:#16223A;border:2px solid var(--accent);display:grid;place-items:center;font-size:15px}
</style>
</head>
<body>
<div id="map" role="img" aria-label="מפת המיקום החי"></div>
<div class="brand">BLUE RONIN</div>
<div class="card" id="card"><h1 id="nm">טוען…</h1><div class="small muted" id="st"></div></div>
<script src="vendor/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="live.js"></script>
</body>
</html>
